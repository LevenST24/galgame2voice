name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v[0-9]*"

permissions:
  contents: read

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Use the locked FFmpeg for audio tests
        # Same as CI's test-linux job: the audio tests need a real ffmpeg.
        run: |
          ffmpeg="$(uv run --frozen --extra dev python -c 'import imageio_ffmpeg; print(imageio_ffmpeg.get_ffmpeg_exe())')"
          "$ffmpeg" -version
          echo "FFMPEG_PATH=$ffmpeg" >> "$GITHUB_ENV"

      - name: Lint (ruff)
        run: uv run ruff check galgame2voice scripts

      - name: Run test suite
        run: uv run pytest -q -p no:cacheprovider
        env:
          GALGAME2VOICE_RATE_LIMIT_DISABLED: "1"

      - name: Verify endpoint resolution behavioral invariant
        run: uv run pytest -q tests/test_sovits_endpoint.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Rebuild frontend bundle
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run deploy

      - name: Build release ZIP
        run: uv run python scripts/package_release.py

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: galgame2voice-release
          path: |
            dist/*.zip
            dist/*.sha256

  build-windows-portable:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: "3.12"
      - name: Install locked portable-build dependencies
        run: uv sync --frozen --extra desktop --no-dev
      - name: Run portable smoke transport tests
        run: |
          uv run --frozen --extra desktop --no-dev python tests/test_smoke_windows_http.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen --extra desktop --no-dev python tests/test_smoke_windows_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm run deploy
      - name: Build Windows portable ZIP
        run: uv run --frozen --extra desktop --no-dev python scripts/build_windows_portable.py
      - name: Test the extracted portable application
        run: |
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*-windows-x64.zip')
          if ($archives.Count -ne 1) {
            throw "Expected exactly 1 Windows portable ZIP in dist, found $($archives.Count)"
          }
          $archive = $archives[0]
          uv run --frozen --extra desktop --no-dev python scripts/verify_windows_portable.py $archive.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --frozen --extra desktop --no-dev python scripts/smoke_windows_portable.py $archive.FullName
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Test turn-reply business recovery
        timeout-minutes: 5
        run: |
          $archives = @(Get-ChildItem -LiteralPath dist -Filter '*-windows-x64.zip')
          if ($archives.Count -ne 1) {
            throw "Expected exactly 1 Windows portable ZIP in dist, found $($archives.Count)"
          }
          $archive = $archives[0]
          $shaFile = "$($archive.FullName).sha256"
          if (-not (Test-Path -LiteralPath $shaFile)) {
            throw "Expected checksum file missing: $shaFile"
          }
          $shaContent = (Get-Content -LiteralPath $shaFile -Raw).Trim()
          $expectedSha = ($shaContent -split '\s+')[0].ToLowerInvariant()
          if ($expectedSha -notmatch '^[0-9a-f]{64}$') {
            throw "Invalid SHA-256 in $($shaFile): $expectedSha"
          }
          $scratch = Join-Path $env:RUNNER_TEMP "smoke-turn-reply-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          uv run --frozen --extra desktop --no-dev python scripts/smoke_windows_turn_reply.py --archive $archive.FullName --expected-sha $expectedSha --scratch $scratch --with-browser-ui
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload turn-reply smoke diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: windows-portable-turn-reply-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/smoke-turn-reply-${{ github.run_id }}-${{ github.run_attempt }}/result.json
            ${{ runner.temp }}/smoke-turn-reply-${{ github.run_id }}-${{ github.run_attempt }}/*.log
            ${{ runner.temp }}/smoke-turn-reply-${{ github.run_id }}-${{ github.run_attempt }}/browser_ui/*.png
            ${{ runner.temp }}/smoke-turn-reply-${{ github.run_id }}-${{ github.run_attempt }}/browser_ui/*.log
      - name: Upload Windows portable package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: galgame2voice-windows-x64
          path: |
            dist/*-windows-x64.zip
            dist/*-windows-x64.zip.sha256
