name: CI

# Third-party actions are pinned to full commit SHAs, not version tags: a tag is
# a movable pointer, so `@v4` lets whoever controls the action repo change what
# runs in this workflow without any commit here changing. The `# vX.Y.Z`
# comment keeps the pin readable — update both together (Renovate/Dependabot can
# be configured to bump pinned SHAs automatically).
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Lint (ruff)
        run: uv run ruff check galgame2voice scripts
        if: matrix.python-version == '3.12'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Run frontend tests
        working-directory: frontend
        run: npm test

      # One suite run per leg: the 3.12 leg is the one that also lints, so it
      # carries coverage; the 3.10 leg stays at full speed.
      - name: Run test suite
        if: matrix.python-version != '3.12'
        run: uv run pytest -q
        env:
          GALGAME2VOICE_RATE_LIMIT_DISABLED: "1"

      - name: Run test suite with coverage
        if: matrix.python-version == '3.12'
        run: uv run pytest -q --cov=galgame2voice --cov-report=term --cov-report=xml
        env:
          GALGAME2VOICE_RATE_LIMIT_DISABLED: "1"

      - name: Upload coverage report
        if: matrix.python-version == '3.12'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: error

  test-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.12'

      - name: Install system dependencies
        # ffmpeg is a real runtime dependency (OGG/voice-note conversion), not an
        # optional extra. Declaring it here keeps the contract explicit instead
        # of depending on whatever the runner image happens to ship.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Run test suite
        run: uv run pytest -q
        env:
          GALGAME2VOICE_RATE_LIMIT_DISABLED: '1'

  dependency-audit:
    # Deliberately non-blocking: the point is visibility into known CVEs, and a
    # red X on every unrelated PR would just train people to ignore it. Promote
    # to a required check once the current findings are triaged.
    continue-on-error: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86 # v5.4.2
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --frozen --extra dev

      - name: Python dependency audit
        run: uv run --with pip-audit pip-audit --progress-spinner off

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Frontend dependency audit
        working-directory: frontend
        run: npm audit --audit-level=high

  frontend-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f7ce87c1d6bead3e36075b2ce75da1f6cc28aaca # v3.9.0

      - name: Validate and build image
        # `build --check` runs Dockerfile static checks; the full build verifies
        # the image actually compiles end-to-end.
        run: |
          docker build --check .
          docker build .
