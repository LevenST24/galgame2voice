spring:
  application:
    name: Springai
  ai:
    deepseek:
      # 任意 OpenAI 兼容服务商的 Key（复制本文件为 application.yaml 后填写）
      api-key: "sk-你的key"
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash

gpt-sovits:
  base-url: http://127.0.0.1:9880
  # 女主的参考音频（用作音色克隆），需放在 GPT-SoVITS 项目里
  ref-audio-path: "参考音频路径.wav"
  # 参考音频里说的内容（和音频内容一致）
  prompt-text: "もちろん全員じゃなくあくまで一部の人なんだけどその一部の人の威力が凄まじくて"
  # 参考音频语言：zh / ja / en
  prompt-lang: ja
  # 合成语言：日文发声
  text-lang: ja
  # 音频输出目录（相对项目运行目录）
  output-dir: "audio"
  # 音频保留时长（分钟）与清理间隔（毫秒）
  audio-retention-minutes: 30
  cleanup-interval-ms: 600000

galgame:
  # 一套 API 的 Key（对话 + 语音识别共用）
  api-key: "sk-你的key"
  # 一套 API 的地址（OpenAI 兼容格式），各家可换
  api-base-url: "https://api.deepseek.com"
  # 对话模型
  chat-model: "deepseek-v4-flash"
  # Telegram Bot
  # Bot Token —— 需要 Telegram 机器人时填写（留空则禁用机器人）
  telegram-bot-token: ""
  telegram-bot-username: "natsume_siki_bot"
  # Telegram API 被墙，走本地代理
  telegram-proxy-host: "127.0.0.1"
  telegram-proxy-port: 10809
  # ffmpeg 路径（GPT-SoVITS 自带，用于 wav -> ogg/opus）
  ffmpeg-path: "你的ffmpeg路径/ffmpeg.exe"
  # 控制台公网地址（cloudflared 隧道，重启会变，需更新）
  console-url: ""
