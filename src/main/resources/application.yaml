spring:
  application:
    name: Springai
  ai:
    deepseek:
      # API Key 从环境变量 DEEPSEEK_API_KEY 读取，未设置时为空（可在页面「AI 设置」临时填写）
      api-key: ${DEEPSEEK_API_KEY:}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash

gpt-sovits:
  base-url: http://127.0.0.1:9880
  # 女主的参考音频（用作音色克隆），需放在 GPT-SoVITS 项目里
  ref-audio-path: "F:/Java/Springai/src/main/resources/nat002_077.ogg"
  # 参考音频里说的内容（和音频内容一致）
  prompt-text: "もちろん全員じゃなくあくまで一部の人なんだけどその一部の人の威力が凄まじくて"
  # 参考音频语言：zh / ja / en
  prompt-lang: ja
  # 合成语言：日文发声
  text-lang: ja
  # 音频输出目录（相对项目运行目录）
  output-dir: "audio"
  # 音频保留时长（分钟）与清理间隔（毫秒）
  audio-retention-minutes: 30
  cleanup-interval-ms: 600000

galgame:
  # 一套 API 的 Key（对话 + 语音识别共用）—— 从环境变量 DEEPSEEK_API_KEY 读取，勿硬编码
  api-key: ${DEEPSEEK_API_KEY:}
  # 一套 API 的地址（OpenAI 兼容格式），各家可换
  api-base-url: "https://api.deepseek.com"
  # 对话模型
  chat-model: "deepseek-v4-flash"
  # Telegram Bot
  # Bot Token —— 从环境变量 TELEGRAM_BOT_TOKEN 读取，勿硬编码
  telegram-bot-token: ${TELEGRAM_BOT_TOKEN:}
  telegram-bot-username: "natsume_siki_bot"
  # Telegram API 被墙，走本地代理
  telegram-proxy-host: "127.0.0.1"
  telegram-proxy-port: 10809
  # ffmpeg 路径（GPT-SoVITS 自带，用于 wav -> ogg/opus）
  ffmpeg-path: "E:/GPT-SoVITS-v2pro-20250604/runtime/ffmpeg.exe"
  # 控制台公网地址（cloudflared 隧道，重启会变，需更新）
  console-url: "https://diff-beautifully-connected-treasury.trycloudflare.com"
