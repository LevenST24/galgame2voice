<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>四季夏目 · 设置</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #f5f6fa; color: #2c3e50; padding: 24px; }
h1 { font-size: 22px; margin-bottom: 20px; }
.card { background: #fff; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.card h2 { font-size: 16px; margin-bottom: 16px; color: #e67e22; }
.field { display: flex; flex-direction: column; margin-bottom: 14px; }
.field label { font-size: 13px; color: #7f8c8d; margin-bottom: 4px; }
.field input, .field select { padding: 8px 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; }
.row { display: flex; gap: 12px; }
.row .field { flex: 1; }
button { padding: 10px 24px; border: none; border-radius: 8px; background: #e67e22; color: #fff; font-size: 15px; cursor: pointer; }
#status { margin-left: 12px; font-size: 14px; }
.ok { color: #27ae60; } .err { color: #e74c3c; }
</style>
</head>
<body>
<h1>四季夏目 · 设置面板</h1>

<div class="card">
<h2>模型设置</h2>
<div class="field">
<label>供应商（选择后自动填好地址和模型）</label>
<select id="provider" onchange="onProviderChange()">
<option value="custom">自定义</option>
<option value="openai">OpenAI</option>
<option value="deepseek">DeepSeek</option>
<option value="anthropic">Anthropic (Claude)</option>
<option value="gemini">Gemini</option>
<option value="siliconflow">硅基流动</option>
<option value="aliyun">阿里通义</option>
</select>
</div>
<div class="field"><label>API 地址（OpenAI 兼容格式）</label><input id="apiBaseUrl" placeholder="https://api.deepseek.com"></div>
<div class="field"><label>API Key</label><input id="apiKey" type="password" placeholder="sk-..."></div>
<div class="row">
<div class="field"><label>对话模型</label><input id="chatModel" placeholder="deepseek-v4-flash"></div>
<div class="field"><label>语音识别模型（留空=不支持）</label><input id="sttModel" placeholder="whisper-1"></div>
</div>
</div>

<div class="card">
<h2>语音设置</h2>
<div class="row">
<div class="field"><label>批量大小 batch_size</label><input id="batchSize" type="number" min="1" max="8"></div>
<div class="field"><label>语速 speed</label><input id="speedFactor" type="number" step="0.1" min="0.5" max="2.0"></div>
<div class="field"><label>温度 temperature</label><input id="temperature" type="number" step="0.1" min="0" max="2.0"></div>
</div>
<div class="row">
<div class="field"><label>top_k</label><input id="topK" type="number" min="1"></div>
<div class="field"><label>top_p</label><input id="topP" type="number" step="0.1" min="0" max="1.0"></div>
<div class="field"><label>seed（-1=随机）</label><input id="seed" type="number"></div>
</div>
<div class="row">
<div class="field"><label>切分方式</label>
<select id="textSplitMethod">
<option value="cut0">cut0 不切</option>
<option value="cut1">cut1 四句一切</option>
<option value="cut2">cut2 五十字一切</option>
<option value="cut3">cut3 中文句号</option>
<option value="cut4">cut4 英文句号</option>
<option value="cut5">cut5 按标点</option>
</select>
</div>
<div class="field"><label>句间停顿（秒）</label><input id="fragmentInterval" type="number" step="0.1" min="0"></div>
</div>
</div>

<button onclick="save()">保存设置</button>
<span id="status"></span>

<script>
const params = new URLSearchParams(location.search);
const token = params.get('token') || '';

const PROVIDERS = {
    openai: { baseUrl: "https://api.openai.com/v1", chatModel: "gpt-4o-mini", sttModel: "whisper-1" },
    deepseek: { baseUrl: "https://api.deepseek.com", chatModel: "deepseek-chat", sttModel: "" },
    anthropic: { baseUrl: "https://api.anthropic.com/v1/", chatModel: "claude-3-5-sonnet-latest", sttModel: "" },
    gemini: { baseUrl: "https://generativelanguage.googleapis.com/v1beta/openai/", chatModel: "gemini-2.0-flash", sttModel: "" },
    siliconflow: { baseUrl: "https://api.siliconflow.cn/v1", chatModel: "deepseek-ai/DeepSeek-V3", sttModel: "FunAudioLLM/SenseVoiceSmall" },
    aliyun: { baseUrl: "https://dashscope.aliyuncs.com/compatible-mode/v1", chatModel: "qwen-plus", sttModel: "qwen-audio-asr" }
};

function onProviderChange() {
    const p = document.getElementById('provider').value;
    if (p === 'custom') return;
    const preset = PROVIDERS[p];
    document.getElementById('apiBaseUrl').value = preset.baseUrl;
    document.getElementById('chatModel').value = preset.chatModel;
    document.getElementById('sttModel').value = preset.sttModel;
}

async function load() {
    const r = await fetch('/api/config?token=' + encodeURIComponent(token));
    const c = await r.json();
    document.getElementById('apiBaseUrl').value = c.apiBaseUrl || '';
    document.getElementById('apiKey').value = c.apiKey || '';
    document.getElementById('chatModel').value = c.chatModel || '';
    document.getElementById('sttModel').value = c.sttModel || '';
    document.getElementById('batchSize').value = c.batchSize ?? 1;
    document.getElementById('speedFactor').value = c.speedFactor ?? 1.0;
    document.getElementById('temperature').value = c.temperature ?? 1.0;
    document.getElementById('topK').value = c.topK ?? 15;
    document.getElementById('topP').value = c.topP ?? 1.0;
    document.getElementById('seed').value = c.seed ?? -1;
    document.getElementById('textSplitMethod').value = c.textSplitMethod || 'cut1';
    document.getElementById('fragmentInterval').value = c.fragmentInterval ?? 0.3;
}

async function save() {
    const payload = {
        apiBaseUrl: document.getElementById('apiBaseUrl').value.trim(),
        apiKey: document.getElementById('apiKey').value.trim(),
        chatModel: document.getElementById('chatModel').value.trim(),
        sttModel: document.getElementById('sttModel').value.trim(),
        batchSize: parseInt(document.getElementById('batchSize').value, 10),
        speedFactor: parseFloat(document.getElementById('speedFactor').value),
        temperature: parseFloat(document.getElementById('temperature').value),
        topK: parseInt(document.getElementById('topK').value, 10),
        topP: parseFloat(document.getElementById('topP').value),
        seed: parseInt(document.getElementById('seed').value, 10),
        textSplitMethod: document.getElementById('textSplitMethod').value,
        fragmentInterval: parseFloat(document.getElementById('fragmentInterval').value)
    };
    const st = document.getElementById('status');
    try {
        await fetch('/api/config?token=' + encodeURIComponent(token), { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
        st.textContent = '已保存 ✅';
        st.className = 'ok';
    } catch (e) {
        st.textContent = '保存失败：' + e.message;
        st.className = 'err';
    }
}

load();
</script>
</body>
</html>
