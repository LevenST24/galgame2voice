[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galgame2voice"
version = "2.0.0"
description = "Local FastAPI server for galgame character AI chat and real-time TTS voice streaming, using an external GPT-SoVITS engine over HTTP"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "galgame2voice Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "httpx[socks]>=0.27.0",
    "socksio>=1.0.0",
    "aiosqlite>=0.20.0",
    "psutil>=6.0.0",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
galgame2voice = "galgame2voice.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["galgame2voice*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests"]

[tool.ruff.lint]
# Progressive adoption, stage 2 of the plan in TEST_INFRA.md.
#
# Stage 1 was "hard errors only" (syntax errors, undefined names, unused
# locals). This stage adds the rule families whose findings are *defects*
# rather than taste, so the gate fails on real problems without burying the
# team in a mass reformat:
#   F     pyflakes  - unused imports, f-strings with no placeholders
#   B     bugbear   - zip() without strict=, mutable defaults, and friends
#   ASYNC           - blocking calls and busy-waits inside async functions
#   E4/E7/E9        - the import/statement/syntax errors from stage 1
#
# Deliberately NOT enabled yet: I (import order), UP (typing modernisation) and
# SIM (style simplifications). They currently report ~190 findings, all
# mechanical, and belong in a dedicated formatting-only commit so that a real
# behavioural change is never hidden inside a reordering diff.
select = ["E4", "E7", "E9", "F", "B", "ASYNC"]

# ASYNC240 flags every pathlib.Path / os.path probe inside an async function.
# The remaining findings are all `is_file()`, `stat()` and `abspath()` calls on
# local files, which cost microseconds; routing them through asyncio.to_thread
# would add a thread hop and a scheduling delay to paths that are already
# correct. Revisit if such a probe ever moves onto a network filesystem.
ignore = ["ASYNC240"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false

