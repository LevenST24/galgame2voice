[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "galgame2voice"
version = "2.0.0"
description = "Lightweight Python/FastAPI companion extension patch for GPT-SoVITS"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "galgame2voice Team" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Framework :: FastAPI",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.0.0",
    "httpx[socks]>=0.27.0",
    "socksio>=1.0.0",
    "aiosqlite>=0.20.0",
    "psutil>=6.0.0",
    "python-telegram-bot>=21.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[project.scripts]
galgame2voice = "galgame2voice.main:run"

[tool.setuptools.packages.find]
where = ["."]
include = ["galgame2voice*"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["tests"]

[tool.ruff.lint]
# Progressive adoption: hard errors only for now (syntax errors, undefined
# names, unbound locals). Widen the rule set as the codebase is cleaned up.
select = ["E9", "F821", "F823", "F841"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = false

